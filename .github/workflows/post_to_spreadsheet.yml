name: ② スプシに転記（確認後に手動実行）

on:
  workflow_dispatch:
    inputs:
      date:
        description: '転記する日付 (例: 2026-04-08)　空白なら今日'
        required: false
        default: ''
      dates:
        description: '複数日まとめて転記 (例: 2026-07-30,2026-07-31,2026-08-01)'
        required: false
        default: ''

jobs:
  post-to-spreadsheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: スプシに転記
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${{ github.event.inputs.dates }}" ]; then
            IFS=',' read -ra DATE_LIST <<< "${{ github.event.inputs.dates }}"
            for d in "${DATE_LIST[@]}"; do
              d=$(echo $d | xargs)
              echo "転記中: $d"
              TARGET_DATE="$d" python post_to_spreadsheet.py
            done
          else
            TARGET_DATE="${{ github.event.inputs.date }}" python post_to_spreadsheet.py
          fi
